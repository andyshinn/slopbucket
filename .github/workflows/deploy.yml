name: Deploy

on:
  push:
    branches: [main]
  # Also dispatched by bootstrap.yml once resources exist.
  workflow_dispatch:
  # Called by rename.yml after it commits the new database_id.
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to deploy (empty for the triggering commit)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Check bootstrap
        id: bootstrap
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' apps/ingest/wrangler.jsonc; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::wrangler.jsonc has no database_id yet. Run the Rename to Slop Bucket workflow (or Bootstrap for a fresh account); it deploys when done."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.bootstrap.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/ingest
          command: d1 migrations apply DB --remote

      # Creates or updates the AI Gateway the ingest Worker routes Workers AI
      # through. Its spend limit blocks AI calls once the daily budget is used;
      # blocked posts stay pending and the next daily run retries them.
      - name: Apply AI Gateway config (daily AI spend limit)
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-gateway/gateways"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(jq -r .id infra/ai-gateway.json)
          get=$(curl -sS -o get.json -w '%{http_code}' -H "$auth" "$api/$id")
          if [ "$get" = 200 ]; then
            code=$(jq 'del(.id)' infra/ai-gateway.json | curl -sS -o out.json -w '%{http_code}' -X PUT -H "$auth" -H "Content-Type: application/json" --data @- "$api/$id")
          else
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST -H "$auth" -H "Content-Type: application/json" --data @infra/ai-gateway.json "$api")
          fi
          if [ "$code" != 200 ]; then
            echo "::error::AI Gateway '$id' update failed (GET $get: $(jq -c .errors get.json); write $code: $(jq -c .errors out.json)). The API token needs the 'AI Gateway: Edit' permission."
            exit 1
          fi
          echo "AI Gateway \`$id\` spend limits: \`$(jq -c .result.spend_limits out.json)\`" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy ingest Worker
        if: steps.bootstrap.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/ingest
          command: deploy

      - name: Short commit
        id: commit
        if: steps.bootstrap.outputs.ready == 'true'
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: steps.bootstrap.outputs.ready == 'true'
        run: pnpm --filter @slop-bucket/site build

      - name: Deploy site Worker
        if: steps.bootstrap.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/site
          # Tags the Worker version with the commit; the admin footer reads it back
          # through the version_metadata binding.
          command: deploy --tag ${{ steps.commit.outputs.short }}

      - name: Summary
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          echo "Site: https://slopbucket.app" >> "$GITHUB_STEP_SUMMARY"
          echo "Health check: https://slopbucket.app/api/health" >> "$GITHUB_STEP_SUMMARY"
