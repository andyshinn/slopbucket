name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build site
        run: pnpm --filter @slop-bucket/site build
      - name: Migration dry run (local D1)
        run: pnpm db:migrate:local
      - name: Validate AI Gateway config
        run: jq -e '.id and .spend_limits.enabled and (.spend_limits.rules | any(.id == "daily-cap" and .enabled and .window == 86400))' infra/ai-gateway.json
