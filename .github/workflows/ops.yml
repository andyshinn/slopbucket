name: Ops

# One-off operations, run from the Actions tab on a phone.
# Note: this repo is public, so anything printed here (including SQL results)
# is visible to anyone who can see the Actions logs.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        required: true
        options:
          - migrate
          - sql
          - set-secret
          - backfill
          - trigger-source
          - reclassify-queued
          - publish-confident
          - queue-low-stars
      sql:
        description: "sql: one read-only statement (SELECT / WITH / EXPLAIN)"
        type: string
        required: false
      secret_name:
        description: "set-secret: name of a repo secret; its value is copied to the Worker secret with the same name"
        type: string
        required: false
      worker:
        description: "set-secret: which Worker gets the secret"
        type: choice
        options: [ingest, site]
        default: ingest
      source:
        description: "backfill / trigger-source: which source"
        type: choice
        options: [all, hn, lobsters, github]
        default: all
      days:
        description: "backfill: how many days back"
        type: string
        default: "90"
      include_old_drops:
        description: "reclassify-queued: also re-check posts dropped by an older model"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ops
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FETCH_QUEUE: sb-fetch
  SOURCES: hn lobsters github

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Apply D1 migrations
        if: inputs.action == 'migrate'
        working-directory: apps/ingest
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Run read-only SQL
        if: inputs.action == 'sql'
        working-directory: apps/ingest
        env:
          SQL: ${{ inputs.sql }}
        run: |
          stmt="${SQL%"${SQL##*[![:space:]]}"}" # trim trailing whitespace
          stmt="${stmt%;}"                       # allow one trailing semicolon
          [ -n "$stmt" ] || { echo "::error::sql input is empty"; exit 1; }
          case "$stmt" in *";"*) echo "::error::Only one statement is allowed"; exit 1 ;; esac
          printf '%s' "$stmt" | grep -qiE '^[[:space:]]*(select|with|explain)\b' \
            || { echo "::error::Statement must start with SELECT, WITH or EXPLAIN"; exit 1; }
          if printf '%s' "$stmt" | grep -qiwE 'insert|update|delete|replace|drop|alter|create|attach|detach|vacuum|reindex|pragma'; then
            echo "::error::Statement contains a write keyword"; exit 1
          fi
          pnpm exec wrangler d1 execute DB --remote --json --command "$stmt" > result.json
          jq '.[0].results' result.json
          {
            echo '```json'
            jq '.[0].results' result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set Worker secret
        if: inputs.action == 'set-secret'
        working-directory: apps/${{ inputs.worker }}
        env:
          NAME: ${{ inputs.secret_name }}
          VALUE: ${{ secrets[inputs.secret_name] }}
        run: |
          printf '%s' "$NAME" | grep -qE '^[A-Z][A-Z0-9_]*$' || { echo "::error::secret_name must be UPPER_SNAKE_CASE"; exit 1; }
          case "$NAME" in CLOUDFLARE_*|GITHUB_*) echo "::error::Refusing to copy $NAME to a Worker"; exit 1 ;; esac
          [ -n "$VALUE" ] || { echo "::error::Repo secret $NAME not found. Add it under Settings > Secrets and variables > Actions first."; exit 1; }
          printf '%s' "$VALUE" | pnpm exec wrangler secret put "$NAME"

      # backfill and trigger-source push fetch jobs (see FetchJob in packages/core)
      # onto the fetch queue through the Cloudflare Queues API.
      - name: Enqueue fetch jobs
        if: inputs.action == 'backfill' || inputs.action == 'trigger-source'
        env:
          ACTION: ${{ inputs.action }}
          SOURCE: ${{ inputs.source }}
          DAYS: ${{ inputs.days }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          queue_id=$(curl -fsS -H "$auth" "$api?per_page=100" | jq -r --arg n "$FETCH_QUEUE" '.result[] | select(.queue_name == $n) | .queue_id')
          [ -n "$queue_id" ] || { echo "::error::Queue $FETCH_QUEUE not found. Run the Bootstrap workflow first."; exit 1; }

          if [ "$ACTION" = backfill ]; then
            printf '%s' "$DAYS" | grep -qE '^[0-9]+$' || { echo "::error::days must be a whole number"; exit 1; }
            until=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            since=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          fi
          sources=$([ "$SOURCE" = all ] && echo "$SOURCES" || echo "$SOURCE")

          for s in $sources; do
            if [ "$ACTION" = backfill ]; then
              job=$(jq -nc --arg s "$s" --arg since "$since" --arg until "$until" '{kind:"fetch",source:$s,mode:"backfill",since:$since,until:$until}')
            else
              job=$(jq -nc --arg s "$s" '{kind:"fetch",source:$s,mode:"manual"}')
            fi
            jq -nc --argjson job "$job" '{body:$job,content_type:"json"}' \
              | curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" --data @- "$api/$queue_id/messages" > /dev/null
            echo "Enqueued $job" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # After lowering review_threshold: publish unreviewed queued posts already at or
      # above it, from their stored confidence. No model calls, nothing re-fetched.
      - name: Publish confident queued posts
        if: inputs.action == 'publish-confident'
        working-directory: apps/ingest
        run: |
          # Same statements the admin status panel runs (packages/core/src/ops.ts).
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { PUBLISH_CONFIDENT_PREVIEW_SQL, PUBLISH_CONFIDENT_SQL } from "@slop-bucket/core";
            writeFileSync("preview.sql", PUBLISH_CONFIDENT_PREVIEW_SQL.replace(/\s+/g, " "));
            writeFileSync("publish.sql", PUBLISH_CONFIDENT_SQL.join(";\n") + ";\n");'
          pnpm exec wrangler d1 execute DB --remote --json --command "$(cat preview.sql)" > preview.json
          echo "Publishing $(jq -r '.[0].results[0] | "\(.posts) posts and \(.tools) new tools at threshold \(.threshold)"' preview.json)." | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm exec wrangler d1 execute DB --remote --file publish.sql
          echo "Done." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Send low-star tools to review
        if: inputs.action == 'queue-low-stars'
        working-directory: apps/ingest
        run: |
          # Same statements the admin status panel runs (packages/core/src/ops.ts).
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { QUEUE_LOW_STAR_PREVIEW_SQL, QUEUE_LOW_STAR_SQL } from "@slop-bucket/core";
            writeFileSync("preview.sql", QUEUE_LOW_STAR_PREVIEW_SQL.replace(/\s+/g, " "));
            writeFileSync("queue.sql", QUEUE_LOW_STAR_SQL.join(";\n") + ";\n");'
          pnpm exec wrangler d1 execute DB --remote --json --command "$(cat preview.sql)" > preview.json
          echo "Sending $(jq -r '.[0].results[0] | "\(.tools) tools and \(.posts) posts under \(.minStars) stars"' preview.json) back to review." | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm exec wrangler d1 execute DB --remote --file queue.sql
          echo "Done." | tee -a "$GITHUB_STEP_SUMMARY"

      # One-off after a classifier change: re-run classification on queued posts nobody
      # has reviewed yet. Their extracted text is cached in R2, so nothing is re-fetched.
      - name: Reclassify unreviewed queued posts
        if: inputs.action == 'reclassify-queued'
        working-directory: apps/ingest
        env:
          OLD_DROPS: ${{ inputs.include_old_drops }}
        run: |
          # Same statements the admin status panel runs (packages/core/src/ops.ts).
          node --input-type=module -e '
            import { RESET_OLD_MODEL_DROPS_SQL, RESET_UNREVIEWED_QUEUED_SQL } from "@slop-bucket/core";
            const sql = [...RESET_UNREVIEWED_QUEUED_SQL, ...(process.env.OLD_DROPS === "true" ? [RESET_OLD_MODEL_DROPS_SQL] : [])];
            console.log(sql.join(";\n") + ";");' > reclassify.sql
          pnpm exec wrangler d1 execute DB --remote --file reclassify.sql
          pnpm exec wrangler d1 execute DB --remote --json --command "SELECT id FROM posts WHERE status = 'pending'" \
            | jq -c '[.[0].results[].id | {body: {kind: "classify", post_id: ., force: true}, content_type: "json"}]' > jobs.json
          total=$(jq length jobs.json)

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          queue_id=$(curl -fsS -H "$auth" "$api?per_page=100" | jq -r '.result[] | select(.queue_name == "sb-classify") | .queue_id')
          [ -n "$queue_id" ] || { echo "::error::Queue sb-classify not found."; exit 1; }
          for offset in $(seq 0 100 $((total - 1))); do
            jq -c --argjson o "$offset" '{messages: .[$o:$o + 100]}' jobs.json \
              | curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" --data @- "$api/$queue_id/messages/batch" > /dev/null
          done
          echo "Re-queued $total posts for classification. At one post at a time this takes roughly $((total * 4 / 60)) minutes; the AI Gateway's daily cap may spread it over more than one day." | tee -a "$GITHUB_STEP_SUMMARY"
